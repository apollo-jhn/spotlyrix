name: Feature Request
description: Suggest a new feature or enhancement for Spotlyrix
title: "feat(<scope>): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggest an idea for Spotlyrix. Make sure your title follows the convention: `feat(<scope>): <description>` (e.g. `feat(lyrics): add synchronized word highlighting`).
  - type: input
    id: scope
    attributes:
      label: Scope
      description: The component or feature area targeted (e.g., lyrics, player, ui, auth, api).
      placeholder: lyrics
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
